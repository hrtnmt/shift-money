<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<title>シフト家計簿 — 来月締め日までの必要額</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 9h18M8 2v4M16 2v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M9 15.5l2 2 4-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>シフト家計簿</span>
  </div>
  <button class="sync-chip" id="syncChip" type="button" aria-live="polite">
    <span class="dot" id="syncDot"></span><span id="syncText">未接続</span>
  </button>
</header>

<main id="app">
  <section class="view" id="view-home" data-view="home"></section>
  <section class="view" id="view-income" data-view="income" hidden></section>
  <section class="view" id="view-expense" data-view="expense" hidden></section>
  <section class="view" id="view-wish" data-view="wish" hidden></section>
  <section class="view" id="view-settings" data-view="settings" hidden></section>
</main>

<nav class="tabbar" aria-label="メニュー">
  <button data-tab="home" class="active"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg><span>ホーム</span></button>
  <button data-tab="income"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg><span>収入</span></button>
  <button data-tab="expense"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg><span>支出</span></button>
  <button data-tab="wish"><svg viewBox="0 0 24 24"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 1 0-7.1 7.1L12 21.5l8.8-8.8a5 5 0 0 0 0-7.1z"/></svg><span>欲しいもの</span></button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>設定</span></button>
</nav>

<dialog id="editor">
  <form method="dialog" id="editorForm">
    <header class="dlg-head"><h2 id="editorTitle">追加</h2><button value="cancel" class="icon-btn" aria-label="閉じる" formnovalidate>×</button></header>
    <div id="editorFields" class="fields"></div>
    <p class="dlg-preview" id="editorPreview"></p>
    <footer class="dlg-foot">
      <button type="button" class="btn ghost danger" id="editorDelete">削除</button>
      <span class="spacer"></span>
      <button value="cancel" class="btn ghost" formnovalidate>キャンセル</button>
      <button value="save" class="btn primary" id="editorSave">保存</button>
    </footer>
  </form>
</dialog>

<dialog id="confirmDlg">
  <form method="dialog" id="confirmForm">
    <header class="dlg-head"><h2 id="confirmTitle">確認</h2><button value="cancel" class="icon-btn" aria-label="閉じる" formnovalidate>×</button></header>
    <div id="confirmBody" class="confirm-body"></div>
    <footer class="dlg-foot"><span class="spacer"></span>
      <button value="cancel" class="btn ghost" formnovalidate id="confirmCancel">やめる</button>
      <button value="ok" class="btn primary" id="confirmOk">OK</button>
    </footer>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
